name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: risklens
          POSTGRES_PASSWORD: risklens
          POSTGRES_DB: risklens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risklens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . ../benchmarks --config pyproject.toml
      - name: Format check
        run: ruff format --check . ../benchmarks --config pyproject.toml
      - name: Type check
        run: mypy
      - name: Tests with coverage gate
        run: pytest --cov=app/core --cov=app/services --cov-fail-under=85
      - name: Migrations apply to a real PostgreSQL
        env:
          DATABASE_URL: postgresql://risklens:risklens@localhost:5432/risklens
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format
      - run: npm test
      - run: npm run build
